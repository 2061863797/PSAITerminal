name: Windows 发布验证

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  POWERSHELL_TELEMETRY_OPTOUT: '1'

jobs:
  test:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: 下载并校验 PowerShell 7.6.4
        shell: pwsh
        run: |
          $asset = 'PowerShell-7.6.4-win-x64.zip'
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $destination = Join-Path $env:RUNNER_TEMP 'PowerShell-7.6.4'
          Invoke-WebRequest "https://github.com/PowerShell/PowerShell/releases/download/v7.6.4/$asset" -OutFile $archive
          $expected = '80832551C52809301E6071C8BAC977BEB5A2F1EC953EB4DB9F94DEB953333793'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "PowerShell 7.6.4 校验失败：$actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $pwsh = Join-Path $destination 'pwsh.exe'
          if ((& $pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()') -ne '7.6.4') {
            throw '下载的 PowerShell 版本不是 7.6.4。'
          }
          "PSAI_PWSH=$pwsh" >> $env:GITHUB_ENV

      - name: 读取模块版本
        shell: pwsh
        run: |
          $version = [string](Import-PowerShellDataFile ./module/PSAITerminal.psd1).ModuleVersion
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "模块版本格式无效：$version" }
          "PSAI_VERSION=$version" >> $env:GITHUB_ENV

      - name: 安装 PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Scope CurrentUser -Force

      - name: 检查 PowerShell 规范
        shell: pwsh
        run: |
          $targets = @(
            './build.ps1'
            './Install-PSAITerminal.ps1'
            './Uninstall-PSAITerminal.ps1'
            './module/PSAITerminal.psd1'
            './module/PSAITerminal.psm1'
          )
          $issues = foreach ($target in $targets) {
            Invoke-ScriptAnalyzer -Path $target -Settings ./.psscriptanalyzer.psd1
          }
          if (@($issues).Count -gt 0) {
            $issues | Format-Table RuleName,Severity,ScriptName,Line,Message -Wrap -AutoSize | Out-Host
            throw "PSScriptAnalyzer 发现 $(@($issues).Count) 个问题。"
          }

      - name: 构建发布包
        shell: pwsh
        run: '& $env:PSAI_PWSH -NoLogo -NoProfile -File ./build.ps1 -Restore -Configuration Release -Package'

      - name: 检查 NuGet 已知漏洞
        shell: pwsh
        run: |
          foreach ($projectPath in @('./src/PSAITerminal.csproj','./src/PowerShell7/PSAITerminal.PowerShell7.csproj')) {
            $auditJson = & dotnet list $projectPath package --vulnerable --include-transitive --format json
            if ($LASTEXITCODE -ne 0) { throw "NuGet 漏洞查询失败：$projectPath" }
            $audit = ($auditJson -join "`n") | ConvertFrom-Json
            $vulnerable = foreach ($project in @($audit.projects)) {
              if (-not $project.PSObject.Properties['frameworks']) { continue }
              foreach ($framework in @($project.frameworks)) {
                if ($null -eq $framework) { continue }
                foreach ($propertyName in @('topLevelPackages','transitivePackages')) {
                  if (-not $framework.PSObject.Properties[$propertyName]) { continue }
                  foreach ($package in @($framework.$propertyName)) {
                    if (@($package.vulnerabilities).Count -gt 0) { $package }
                  }
                }
              }
            }
            if (@($vulnerable).Count -gt 0) {
              $details = @($vulnerable | ForEach-Object { "$($_.id) $($_.resolvedVersion)" }) -join ', '
              throw "发现已知漏洞依赖：$projectPath：$details"
            }
          }

      - name: 运行完整回归
        shell: pwsh
        run: '& $env:PSAI_PWSH -NoLogo -NoProfile -File ./tests/run.ps1'

      - name: 验证 5.1 x64、5.1 x86 与 7.6.4 共享状态
        shell: pwsh
        run: |
          $module = (Resolve-Path "./out/PSAITerminal-$env:PSAI_VERSION/PSAITerminal.psd1").Path
          $state = Join-Path $env:RUNNER_TEMP 'PSAITerminal.Hosts'
          $config = Join-Path $state 'config'
          $data = Join-Path $state 'data'
          $credential = 'PSAITerminal/Test/CI-' + [guid]::NewGuid().ToString('N')
          $x64 = Join-Path $env:windir 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $x86 = Join-Path $env:windir 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe'
          & $x64 -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tests/parse.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 x64 语法检查失败。' }
          & $env:PSAI_PWSH -NoLogo -NoProfile -NonInteractive -File ./tests/parse.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 7.6.4 语法检查失败。' }
          & $x86 -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tests/parse.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 x86 语法检查失败。' }
          & $x64 -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tests/host-probe.ps1 -ModulePath $module -ConfigPath $config -DataPath $data -StoreEntryTarget $credential -Phase Create
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 x64 回归失败。' }
          & $env:PSAI_PWSH -NoLogo -NoProfile -NonInteractive -File ./tests/host-probe.ps1 -ModulePath $module -ConfigPath $config -DataPath $data -StoreEntryTarget $credential -Phase Update
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 7.6.4 回归失败。' }
          & $x86 -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tests/host-probe.ps1 -ModulePath $module -ConfigPath $config -DataPath $data -StoreEntryTarget $credential -Phase Verify
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 x86 回归失败。' }

      - name: 检查 C# 格式
        shell: pwsh
        run: |
          dotnet format ./src/PSAITerminal.csproj --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { throw "核心项目格式检查失败：$LASTEXITCODE" }
          dotnet format ./src/PowerShell7/PSAITerminal.PowerShell7.csproj --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 7 集成项目格式检查失败：$LASTEXITCODE" }
          dotnet format ./tools/InteractiveSmoke/InteractiveSmoke.csproj --verify-no-changes
          if ($LASTEXITCODE -ne 0) { throw "ConPTY 项目格式检查失败：$LASTEXITCODE" }

      - name: 检查脚本语法
        shell: pwsh
        run: |
          $scripts = @(
            './build.ps1'
            './Install-PSAITerminal.ps1'
            './Uninstall-PSAITerminal.ps1'
            './module/PSAITerminal.psd1'
            './module/PSAITerminal.psm1'
            './tests/run.ps1'
            './tests/host-probe.ps1'
            './tests/parse.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) { throw "PowerShell 语法检查失败：$script`n$($errors | Out-String)" }
          }
      - name: 验证 Windows ConPTY 交互
        shell: pwsh
        run: |
          dotnet run --project ./tools/InteractiveSmoke/InteractiveSmoke.csproj `
            --configuration Release -- `
            $env:PSAI_PWSH `
            (Resolve-Path "./out/PSAITerminal-$env:PSAI_VERSION/PSAITerminal.psd1")
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 7.6.4 ConPTY 失败。' }
          dotnet run --project ./tools/InteractiveSmoke/InteractiveSmoke.csproj `
            --configuration Release -- `
            (Join-Path $env:windir 'System32/WindowsPowerShell/v1.0/powershell.exe') `
            (Resolve-Path "./out/PSAITerminal-$env:PSAI_VERSION/PSAITerminal.psd1")
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 ConPTY 失败。' }

      - name: 检查发布内容并生成校验和
        shell: pwsh
        run: |
          $package = Resolve-Path "./out/PSAITerminal-$env:PSAI_VERSION"
          $archive = Resolve-Path "./out/PSAITerminal-$env:PSAI_VERSION.zip"
          $expected = @(
            'PSAITerminal.psd1'
            'PSAITerminal.psm1'
            'bin/PSAITerminal.dll'
            'bin/PSAITerminal.PowerShell7.dll'
            'README.md'
            'CHANGELOG.md'
            'LICENSE'
            'Install-PSAITerminal.ps1'
            'Uninstall-PSAITerminal.ps1'
            'en-US/about_PSAITerminal.help.txt'
            'zh-CN/about_PSAITerminal.help.txt'
          ) | Sort-Object
          $actual = Get-ChildItem -LiteralPath $package -Recurse -File | ForEach-Object {
            $_.FullName.Substring($package.Path.Length + 1).Replace('\', '/')
          } | Sort-Object
          if (($expected -join "`n") -cne ($actual -join "`n")) {
            throw "发布文件集合不正确。`n期望：$($expected -join ', ')`n实际：$($actual -join ', ')"
          }
          $manifest = Test-ModuleManifest (Join-Path $package 'PSAITerminal.psd1')
          if ($manifest.Version -ne [version]$env:PSAI_VERSION) { throw "发布清单版本不一致：$($manifest.Version)" }
          $assembly = [Reflection.AssemblyName]::GetAssemblyName((Join-Path $package 'bin/PSAITerminal.dll'))
          if ($assembly.Version -ne [version]"$env:PSAI_VERSION.0") { throw "程序集版本不一致：$($assembly.Version)" }
          $integrationAssembly = [Reflection.AssemblyName]::GetAssemblyName((Join-Path $package 'bin/PSAITerminal.PowerShell7.dll'))
          if ($integrationAssembly.Version -ne [version]"$env:PSAI_VERSION.0") { throw "集成程序集版本不一致：$($integrationAssembly.Version)" }
          if (-not (Test-Path -LiteralPath "./out/PSAITerminal.$env:PSAI_VERSION.nupkg")) { throw 'Gallery nupkg 未生成。' }
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $archive
          "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($archive))" |
            Set-Content -LiteralPath './out/SHA256SUMS-Windows.txt' -Encoding ascii

      - name: 上传发布候选包
        uses: actions/upload-artifact@v4
        with:
          name: PSAITerminal-${{ env.PSAI_VERSION }}-Windows
          path: |
            out/PSAITerminal-${{ env.PSAI_VERSION }}
            out/PSAITerminal-${{ env.PSAI_VERSION }}.zip
            out/PSAITerminal.${{ env.PSAI_VERSION }}.nupkg
            out/SHA256SUMS-Windows.txt
          if-no-files-found: error
